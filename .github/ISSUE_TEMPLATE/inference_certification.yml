name: Inference hardware run
description: Submit a passing, mismatching, or blocked physical CPU, GPU, or NPU run for cfetch embedding profile v1.
title: "[Inference run]: "
body:
  - type: markdown
    attributes:
      value: |
        A device is not a v1 producer merely because the model loads or its vendor advertises INT8. Passing and failing runs are both useful. Submit the exact cfetch report plus accelerator placement evidence described in [the certification guide](https://github.com/corbet-labs/cfetch/blob/main/docs/accelerator-certification.md). Only an exact pass with the required review can be admitted. Do not include secrets, private model inputs, usernames, hostnames, or private paths.
  - type: dropdown
    id: family
    attributes:
      label: Hardware family
      options:
        - CPU x86-64
        - CPU arm64
        - Apple Metal
        - Apple Neural Engine
        - Intel OpenVINO CPU
        - Intel OpenVINO GPU
        - Intel OpenVINO NPU
        - AMD XDNA / XDNA2 NPU
        - AMD MIGraphX GPU
        - NVIDIA CUDA GPU
        - NVIDIA TensorRT GPU
        - Qualcomm QNN HTP NPU
        - Windows DirectML GPU
        - WebGPU or Vulkan-class GPU
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Exact physical device
      description: Vendor, model, architecture or generation, and relevant accelerator identifier.
      placeholder: "AMD Ryzen AI 9 HX 370; XDNA2 NPU"
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Run outcome
      options:
        - Exact 11/11 byte match
        - Executed with one or more byte mismatches
        - Provider or model could not execute
        - Packaging or runtime setup blocked the run
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and driver
      description: Include OS version, architecture, accelerator driver, and vendor runtime versions.
      placeholder: "Windows 11 24H2 arm64; Qualcomm driver ...; QNN ..."
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: cfetch package identity
      description: Commit, package/variant name, and build source. Do not report an uncommitted binary or upload proprietary provider DLLs.
      placeholder: "commit df2d676; cfetch-local-...; built from the public flake"
    validations:
      required: true
  - type: textarea
    id: certificate
    attributes:
      label: Certificate JSON or failure output
      description: Drag in the complete `cfetch-inference-certificate.json`, or paste it. If setup/execution failed before a report was written, paste the bounded error output instead. Remove private paths and host identity.
    validations:
      required: true
  - type: textarea
    id: placement
    attributes:
      label: Placement and INT8-kernel evidence
      description: For GPU/NPU runs, attach the vendor profiler, compute plan, or equivalent export proving full graph ownership and INT8 learned-region kernels. Explain how to inspect it. CPU certificates may state that this is not applicable.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction commands
      description: Include the exact public package/model download and certification commands.
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: The run used the public model-v1 bundle without recalibration, conversion that changes semantics, fine-tuning, distillation, pruning, or another quantization.
          required: true
        - label: I reported the actual outcome without treating a load, approximate match, or failed run as producer support.
          required: true
        - label: If accelerator inference executed, ORT CPU fallback was disabled and provider-internal placement is covered by the attached evidence; otherwise I described the blocker.
          required: true
        - label: I removed credentials, private inputs, usernames, hostnames, private paths, and unrelated machine data.
          required: true
