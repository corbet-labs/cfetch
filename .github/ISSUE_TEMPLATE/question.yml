name: Question
description: Ask for installation, configuration, or usage help.
title: "[Question]: "
labels:
  - question
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and environment
      placeholder: "cfetch 0.9.4; macOS arm64; Gemini CLI"
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Include relevant redacted commands and output.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private memory, hostnames, and private configuration.
          required: true
