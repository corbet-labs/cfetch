# Tag v* -> GitHub release with an archive for every supported platform.
# Every archive contains the binary, cfetch's license and the generated
# third-party license/NOTICE bundle. Uses only the workflow's own GITHUB_TOKEN
# (via the contents: write permission) — no configured secrets.
#
# ARTIFACT NAMING: <os>-cfetch-<arch>-<tag>. The silicon and microarchitecture
# axes of the full scheme (<os>-cfetch-<silicon>[-<level>][-bin]-<version>,
# e.g. linux-cfetch-amd-v3-v1.2.3) describe which INFERENCE engine is linked
# in. Nothing is linked in yet — these binaries call out to an endpoint — so
# naming them by silicon would claim a capability they do not have. The axis
# arrives with integrated inference, and these names extend into it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  preflight:
    name: Validate release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject 1.0+ and mismatched tags
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          tag_version=${GITHUB_REF_NAME#v}
          test "$tag_version" = "$version" || {
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          }
          case "$version" in
            0.*) ;;
            *) echo "cfetch 1.0+ is operator-blocked (requested $version)" >&2; exit 1 ;;
          esac

  build:
    name: Build (${{ matrix.artifact }})
    needs: preflight
    strategy:
      # One platform failing must not silently ship a partial release; every
      # platform's result stays visible and the publish job gates on all.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-cfetch-x86_64
            bin: cfetch
          - os: macos-latest
            artifact: mac-cfetch-arm64
            bin: cfetch
          # Intel macOS is CROSS-BUILT on the arm64 runner rather than taken
          # from a macos-13 runner: those are being wound down and a queued
          # leg would block the whole release behind hardware we do not
          # control. The Apple SDK ships both slices, so this needs no
          # emulation and no second machine.
          - os: macos-latest
            artifact: mac-cfetch-x86_64
            bin: cfetch
            target: x86_64-apple-darwin
          - os: windows-latest
            artifact: win-cfetch-x86_64
            bin: cfetch.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked
          fi
      - name: Stage artifact
        shell: bash
        run: |
          package="${{ matrix.artifact }}-${GITHUB_REF_NAME}"
          mkdir -p "dist/$package"
          if [ -n "${{ matrix.target }}" ]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/$package/${{ matrix.bin }}"
          else
            cp "target/release/${{ matrix.bin }}" "dist/$package/${{ matrix.bin }}"
          fi
          cp LICENSE.md THIRD-PARTY-LICENSES.txt "dist/$package/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd dist && 7z a "$package.zip" "$package" >/dev/null)
          else
            (cd dist && tar -czf "$package.tar.gz" "$package")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}-${{ github.ref_name }}.*
          if-no-files-found: error

  publish:
    # Gates on every platform: a release that is missing a supported platform
    # is a broken promise, not a partial success.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: staged
      - name: Collect
        run: |
          mkdir -p dist
          find staged -type f -exec cp {} dist/ \;
          cp LICENSE.md dist/LICENSE.md
          cp THIRD-PARTY-LICENSES.txt dist/THIRD-PARTY-LICENSES.txt
          ls -la dist
      # Published as a release asset because downstream packaging consumes it
      # rather than re-hashing: the Homebrew tap regenerates its formula from
      # these lines, and a formula whose sha256 came from anywhere but the
      # released bytes is a formula that can silently install something else.
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > "$RUNNER_TEMP/checksums_sha256.txt"
          mv "$RUNNER_TEMP/checksums_sha256.txt" .
          cat checksums_sha256.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
