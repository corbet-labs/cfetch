name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/signatures/cla.json'
          path-to-document: 'https://github.com/corbet-labs/cfetch/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'julian-corbet,dependabot[bot],*[bot]'
          custom-notsigned-prcomment: >
            Thank you for the contribution. Before it can be merged, please sign the
            [Contributor License Agreement](https://github.com/corbet-labs/cfetch/blob/main/CLA.md)
            by posting the sentence below as a comment on this pull request.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA.'
          lock-pullrequest-aftermerge: false
