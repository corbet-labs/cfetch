# Public-repository standard runners only. This workflow uses no secrets and
# accepts only the frozen v1 bundle from this repository's public releases.
name: Inference certification

on:
  workflow_dispatch:
    inputs:
      bundle_url:
        description: Public cfetch GitHub-release URL for the frozen v1 model bundle
        required: true
        default: https://github.com/corbet-labs/cfetch/releases/download/model-v1/cfetch-embeddinggemma-300m-a8w8-v1.tar.gz
        type: string
      bundle_sha256:
        description: SHA-256 of the complete model bundle archive
        required: true
        default: 12892e4fb2dea4e60adc03669f32dcee2813d2764c8bf6c25ecf6b95aa5756b1
        type: string

permissions:
  contents: read

jobs:
  cpu-kat:
    name: CPU byte KAT (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Validate frozen bundle input
        env:
          BUNDLE_URL: ${{ inputs.bundle_url }}
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
        run: |
          test "$BUNDLE_SHA256" = 12892e4fb2dea4e60adc03669f32dcee2813d2764c8bf6c25ecf6b95aa5756b1
          case "$BUNDLE_URL" in
            https://github.com/corbet-labs/cfetch/releases/download/*/cfetch-embeddinggemma-300m-a8w8-v1.tar.gz) ;;
            *) echo "bundle_url must name the frozen archive in a public cfetch GitHub release" >&2; exit 2 ;;
          esac
      - uses: cachix/install-nix-action@v31
      - name: Record non-identifying hardware evidence
        run: bash scripts/certification-hardware.sh | tee "$RUNNER_TEMP/cfetch-hardware.txt"
      - name: Build the pinned local CPU package
        run: nix build .#cfetch-local-cpu --out-link "$RUNNER_TEMP/cfetch-local"
      - name: Download frozen model bundle
        env:
          BUNDLE_URL: ${{ inputs.bundle_url }}
        run: |
          curl --proto '=https' --tlsv1.2 --location --fail --show-error \
            --output "$RUNNER_TEMP/cfetch-embedding-v1.tar.gz" \
            "$BUNDLE_URL"
      - name: Run exact vector certification
        env:
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
        run: |
          bash scripts/certify-inference-bundle.sh \
            "$RUNNER_TEMP/cfetch-embedding-v1.tar.gz" \
            "$BUNDLE_SHA256" \
            "$RUNNER_TEMP/cfetch-local/bin/cfetch" \
            "$RUNNER_TEMP/cfetch-inference-certificate.json" \
            auto
          jq '{provider,device_class,os,arch,onnxruntime_distribution,onnxruntime_archive_sha256,onnxruntime_library_sha256,exact_vector_conformance,producer_eligible_without_external_review,answers:(.known_answers|length)}' \
            "$RUNNER_TEMP/cfetch-inference-certificate.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inference-certificate-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/cfetch-inference-certificate.json
            ${{ runner.temp }}/cfetch-hardware.txt
          if-no-files-found: warn

  apple-coreml-kat:
    name: Apple CoreML KAT (${{ matrix.provider }})
    strategy:
      fail-fast: false
      matrix:
        provider: [coreml-gpu, coreml-npu]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Validate frozen bundle input
        env:
          BUNDLE_URL: ${{ inputs.bundle_url }}
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
        run: |
          test "$BUNDLE_SHA256" = 12892e4fb2dea4e60adc03669f32dcee2813d2764c8bf6c25ecf6b95aa5756b1
          case "$BUNDLE_URL" in
            https://github.com/corbet-labs/cfetch/releases/download/*/cfetch-embeddinggemma-300m-a8w8-v1.tar.gz) ;;
            *) echo "bundle_url must name the frozen archive in a public cfetch GitHub release" >&2; exit 2 ;;
          esac
      - uses: cachix/install-nix-action@v31
      - name: Record non-identifying hardware evidence
        run: bash scripts/certification-hardware.sh | tee "$RUNNER_TEMP/cfetch-hardware.txt"
      - name: Build the pinned CoreML test package
        run: nix build .#cfetch-test-coreml --out-link "$RUNNER_TEMP/cfetch-coreml"
      - name: Download frozen model bundle
        env:
          BUNDLE_URL: ${{ inputs.bundle_url }}
        run: |
          curl --proto '=https' --tlsv1.2 --location --fail --show-error \
            --output "$RUNNER_TEMP/cfetch-embedding-v1.tar.gz" \
            "$BUNDLE_URL"
      - name: Run exact vector certification with compute-plan logging
        env:
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
          PROVIDER: ${{ matrix.provider }}
        run: |
          set -o pipefail
          bash scripts/certify-inference-bundle.sh \
            "$RUNNER_TEMP/cfetch-embedding-v1.tar.gz" \
            "$BUNDLE_SHA256" \
            "$RUNNER_TEMP/cfetch-coreml/bin/cfetch" \
            "$RUNNER_TEMP/cfetch-inference-certificate.json" \
            "$PROVIDER" 2>&1 | tee "$RUNNER_TEMP/cfetch-coreml-run.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inference-certificate-macos-15-${{ matrix.provider }}
          path: |
            ${{ runner.temp }}/cfetch-inference-certificate.json
            ${{ runner.temp }}/cfetch-coreml-run.log
            ${{ runner.temp }}/cfetch-hardware.txt
          if-no-files-found: warn

  intel-openvino-cpu-kat:
    name: Intel OpenVINO CPU KAT
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Validate frozen bundle input
        env:
          BUNDLE_URL: ${{ inputs.bundle_url }}
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
        run: |
          test "$BUNDLE_SHA256" = 12892e4fb2dea4e60adc03669f32dcee2813d2764c8bf6c25ecf6b95aa5756b1
          case "$BUNDLE_URL" in
            https://github.com/corbet-labs/cfetch/releases/download/*/cfetch-embeddinggemma-300m-a8w8-v1.tar.gz) ;;
            *) echo "bundle_url must name the frozen archive in a public cfetch GitHub release" >&2; exit 2 ;;
          esac
      - uses: cachix/install-nix-action@v31
      - name: Record non-identifying hardware evidence
        run: bash scripts/certification-hardware.sh | tee "$RUNNER_TEMP/cfetch-hardware.txt"
      - name: Build the pinned OpenVINO test package
        run: nix build .#cfetch-test-openvino --out-link "$RUNNER_TEMP/cfetch-openvino"
      - name: Download frozen model bundle
        env:
          BUNDLE_URL: ${{ inputs.bundle_url }}
        run: |
          curl --proto '=https' --tlsv1.2 --location --fail --show-error \
            --output "$RUNNER_TEMP/cfetch-embedding-v1.tar.gz" \
            "$BUNDLE_URL"
      - name: Run exact vector certification
        env:
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
        run: |
          set -o pipefail
          bash scripts/certify-inference-bundle.sh \
            "$RUNNER_TEMP/cfetch-embedding-v1.tar.gz" \
            "$BUNDLE_SHA256" \
            "$RUNNER_TEMP/cfetch-openvino/bin/cfetch" \
            "$RUNNER_TEMP/cfetch-inference-certificate.json" \
            openvino-cpu 2>&1 | tee "$RUNNER_TEMP/cfetch-openvino-run.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inference-certificate-ubuntu-24.04-openvino-cpu
          path: |
            ${{ runner.temp }}/cfetch-inference-certificate.json
            ${{ runner.temp }}/cfetch-openvino-run.log
            ${{ runner.temp }}/cfetch-hardware.txt
          if-no-files-found: warn

  windows-provider-kat:
    name: Windows ${{ matrix.provider }} KAT (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            provider: directml
          - runner: windows-11-arm
            provider: qnn
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Validate frozen bundle input
        shell: pwsh
        env:
          BUNDLE_URL: ${{ inputs.bundle_url }}
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
        run: |
          if ($env:BUNDLE_SHA256 -ne "12892e4fb2dea4e60adc03669f32dcee2813d2764c8bf6c25ecf6b95aa5756b1") {
            throw "unexpected model bundle digest"
          }
          $uri = [Uri]$env:BUNDLE_URL
          if ($uri.Scheme -ne "https" -or $uri.Host -ne "github.com" -or
              -not $uri.AbsolutePath.StartsWith("/corbet-labs/cfetch/releases/download/") -or
              -not $uri.AbsolutePath.EndsWith("/cfetch-embeddinggemma-300m-a8w8-v1.tar.gz")) {
            throw "bundle_url must name the frozen archive in a public cfetch GitHub release"
          }
      - uses: dtolnay/rust-toolchain@stable
      - name: Record non-identifying hardware evidence
        shell: pwsh
        run: ./scripts/certification-hardware.ps1 | Tee-Object "$env:RUNNER_TEMP/cfetch-hardware.jsonl"
      - name: Build pinned provider evidence package
        shell: pwsh
        env:
          PROVIDER: ${{ matrix.provider }}
        run: ./scripts/build-windows-inference-package.ps1 -Provider $env:PROVIDER -Output "$env:RUNNER_TEMP/cfetch-$env:PROVIDER"
      - name: Download frozen model bundle
        shell: pwsh
        env:
          BUNDLE_URL: ${{ inputs.bundle_url }}
        run: Invoke-WebRequest -Uri $env:BUNDLE_URL -OutFile "$env:RUNNER_TEMP/cfetch-embedding-v1.tar.gz"
      - name: Run exact vector certification
        shell: pwsh
        env:
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
          PROVIDER: ${{ matrix.provider }}
        run: |
          ./scripts/certify-windows-inference-package.ps1 `
            -Package "$env:RUNNER_TEMP/cfetch-$env:PROVIDER" `
            -Bundle "$env:RUNNER_TEMP/cfetch-embedding-v1.tar.gz" `
            -BundleSha256 $env:BUNDLE_SHA256 `
            -Report "$env:RUNNER_TEMP/cfetch-inference-certificate.json" `
            2>&1 | Tee-Object "$env:RUNNER_TEMP/cfetch-$env:PROVIDER-run.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inference-certificate-${{ matrix.runner }}-${{ matrix.provider }}
          path: |
            ${{ runner.temp }}/cfetch-inference-certificate.json
            ${{ runner.temp }}/cfetch-${{ matrix.provider }}-run.log
            ${{ runner.temp }}/cfetch-hardware.jsonl
            ${{ runner.temp }}/cfetch-${{ matrix.provider }}/runtime-manifest.json
          if-no-files-found: warn
