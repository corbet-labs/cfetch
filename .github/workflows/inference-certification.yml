# Public-repository standard runners only. This workflow uses no secrets and
# accepts only the frozen v1 bundle from this repository's public releases.
name: Inference certification

on:
  workflow_dispatch:
    inputs:
      bundle_url:
        description: Public cfetch GitHub-release URL for the frozen v1 model bundle
        required: true
        type: string
      bundle_sha256:
        description: SHA-256 of the complete model bundle archive
        required: true
        default: 12892e4fb2dea4e60adc03669f32dcee2813d2764c8bf6c25ecf6b95aa5756b1
        type: string

permissions:
  contents: read

jobs:
  cpu-kat:
    name: CPU byte KAT (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Validate frozen bundle input
        env:
          BUNDLE_URL: ${{ inputs.bundle_url }}
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
        run: |
          test "$BUNDLE_SHA256" = 12892e4fb2dea4e60adc03669f32dcee2813d2764c8bf6c25ecf6b95aa5756b1
          case "$BUNDLE_URL" in
            https://github.com/corbet-labs/cfetch/releases/download/*/cfetch-embeddinggemma-300m-a8w8-v1.tar.gz) ;;
            *) echo "bundle_url must name the frozen archive in a public cfetch GitHub release" >&2; exit 2 ;;
          esac
      - uses: cachix/install-nix-action@v31
      - name: Build the pinned local CPU package
        run: nix build .#cfetch-local-cpu --out-link "$RUNNER_TEMP/cfetch-local"
      - name: Download frozen model bundle
        env:
          BUNDLE_URL: ${{ inputs.bundle_url }}
        run: |
          curl --proto '=https' --tlsv1.2 --location --fail --show-error \
            --output "$RUNNER_TEMP/cfetch-embedding-v1.tar.gz" \
            "$BUNDLE_URL"
      - name: Run exact vector certification
        env:
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
        run: |
          bash scripts/certify-inference-bundle.sh \
            "$RUNNER_TEMP/cfetch-embedding-v1.tar.gz" \
            "$BUNDLE_SHA256" \
            "$RUNNER_TEMP/cfetch-local/bin/cfetch" \
            "$RUNNER_TEMP/cfetch-inference-certificate.json" \
            auto
          jq '{provider,device_class,os,arch,onnxruntime_distribution,onnxruntime_archive_sha256,onnxruntime_library_sha256,exact_vector_conformance,producer_eligible_without_external_review,answers:(.known_answers|length)}' \
            "$RUNNER_TEMP/cfetch-inference-certificate.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: inference-certificate-${{ matrix.runner }}
          path: ${{ runner.temp }}/cfetch-inference-certificate.json
          if-no-files-found: error
