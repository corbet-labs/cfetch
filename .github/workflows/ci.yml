# Test + lint gate. Push is limited to main so a pull request runs once, not
# twice. No secrets are used anywhere in this workflow.
#
# All three platforms are SUPPORTED and blocking: test + clippy must pass on
# Linux, macOS and Windows. Windows was promoted out of its experimental job
# on 2026-08-21, the first run where it went green — the PRD makes a failing
# platform a release blocker once its port has landed, and the port has.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      # Keep every platform's result visible even when one fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Enforce the operator's pre-1.0 lock
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          case "$version" in
            0.*) ;;
            *) echo "cfetch 1.0+ is operator-blocked (Cargo.toml has $version)" >&2; exit 1 ;;
          esac
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test
        run: cargo test --locked
      - name: Clippy (zero warnings)
        run: cargo clippy --all-targets --locked -- -D warnings
