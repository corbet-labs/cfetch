[package]
name = "cfetch"
version = "0.6.0"
edition = "2024"
license = "FSL-1.1-ALv2"
description = "A second brain for coding agents: privilege-ring memory, hook injection, retrieval, and a code index in one binary"
repository = "https://github.com/julian-corbet/cfetch"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
ignore = "0.4"
notify = "8"
ratatui = "0.30.2"
rusqlite = { version = "0.37", features = ["bundled"] }
# flock(2) for the advisory lockfile (src/lockfile.rs): permanent lock file,
# kernel-released on holder death — no stale-steal heuristics.
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Codex config.toml registration only (src/install.rs): structured upsert that
# preserves the user's comments and formatting — string-appending to a foreign
# config file is how files get corrupted.
toml_edit = "0.23"
tree-sitter = "0.26.12"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
# Embeddings HTTP client only (src/embed.rs). Minimal feature set: rustls for
# https endpoints, no gzip/charset/cookies; redirects are disabled per request
# policy (SSRF hardening), which ureq supports natively.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
