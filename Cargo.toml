[package]
name = "cfetch"
version = "0.9.9"
edition = "2024"
rust-version = "1.95"
license = "FSL-1.1-ALv2"
description = "Cited, trust-tiered memory for AI coding agents over plain Markdown"
repository = "https://github.com/corbet-labs/cfetch"
readme = "README.md"
publish = ["crates-io"]
keywords = ["ai-agents", "memory", "mcp", "retrieval", "markdown"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
include = [
  "/src/**",
  "/build.rs",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/docs/accelerator-certification.md",
  "/docs/ai-maintenance.md",
  "/docs/embedding-profile-v1.md",
  "/LICENSE.md",
  "/THIRD-PARTY-LICENSES.txt",
  "/release/variants.json",
  "/release/inference-certifications.json",
]

[features]
default = []
# FastEmbed owns tokenization and the common embedding API; ORT owns graph
# execution. Accelerator packages enable exactly the provider they ship.
inference-ort = [
  "dep:fastembed",
  "dep:ort",
  "dep:tokenizers",
  "ort/load-dynamic",
]
# There is intentionally no ORT download/bundled feature. The ort-sys 1.28
# static archive failed the v1 byte KAT while Microsoft's official 1.28 shared
# release passed it; local producer packages must pin an admitted runtime.
inference-coreml = ["inference-ort", "ort/coreml"]
inference-directml = ["inference-ort", "ort/directml"]
inference-openvino = ["inference-ort", "ort/openvino"]
inference-qnn = ["inference-ort", "ort/qnn"]
inference-vitis = ["inference-ort", "ort/vitis"]
inference-cuda = ["inference-ort", "ort/cuda"]
inference-tensorrt = ["inference-ort", "ort/tensorrt"]
# MIGraphX is the maintained ONNX Runtime path for AMD GPUs.  It receives the
# already-quantized v1 Q/DQ graph; cfetch deliberately does not enable
# MIGraphX's calibration-table quantizer, which would create incompatible
# scales.
inference-migraphx = ["inference-ort", "ort/migraphx"]
# ORT removed its ROCm EP in 1.23; MIGraphX is the maintained AMD GPU path.
inference-webgpu = [
  "inference-ort",
  "fastembed/ort-ep-device",
  "ort/api-22",
]

[dependencies]
# Exact-pinned harness configuration adapter. cfetch decides which surfaces
# are behaviorally compatible; this crate owns per-harness schemas, paths,
# atomic writes, first-touch backups, and ownership ledgers.
agent-config = "=0.4.0"
# Exact-pinned transcript normalizer. cfetch retains its cumulative-ledger
# semantics at the boundary instead of exposing this crate's IR directly.
agent-session = "=0.5.9"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
# No built-in model catalog or network fetch: cfetch supplies and verifies the
# exact user-defined v1 artifact bytes.
# Pinned to the public FastEmbed session-controls change proposed upstream in
# https://github.com/Anush008/fastembed-rs/pull/280. This preserves FastEmbed's
# pipeline while allowing cfetch to prohibit CPU fallback and specialize QNN
# sessions to the profile's fixed shapes.
fastembed = { version = "=6.0.0", git = "https://github.com/corbet-labs/fastembed-rs", rev = "1d9b6381354c23d7a17f61b0486fdabca1a724b0", default-features = false, optional = true }
ignore = "0.4"
iroh = "1.0.3"
# BLAKE3-verified, resumable artifact transfer over the daemon's existing
# authenticated iroh endpoint. We use only the in-memory store and wire
# protocol; cfetch's packed vector store remains the durable record.
iroh-blobs = { version = "=0.103.0", default-features = false }
notify = "8"
# Kept exact with FastEmbed's own pin so provider features unify onto one ORT.
# API 18 is the floor for normal provider packages. The WebGPU plugin feature
# raises only its evidence package to API 22 for registered-device discovery.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["api-18", "ndarray", "std"], optional = true }
ratatui = "0.30.2"
tokenizers = { version = "=0.23.1", default-features = false, optional = true }
# Exact-pinned official MCP SDK. cfetch owns its tools; rmcp owns JSON-RPC,
# protocol negotiation, capability discovery, schemas, and stdio framing.
rmcp = { version = "=3.1.4", default-features = false, features = ["server", "transport-io"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
# Used only by the cfetch 0.9 one-time Codex registration conversion and the
# features.hooks health check. New registrations are owned by agent-config.
toml_edit = "0.25"
tree-sitter = "0.26.12"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
# Embeddings HTTP client only (src/embed.rs). Minimal feature set: rustls for
# https endpoints, no gzip/charset/cookies; redirects are disabled per request
# policy (SSRF hardening), which ureq supports natively.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# flock(2) for the advisory lockfile (src/lockfile.rs) and uname(2) for the
# serving host's origin (src/serve.rs). UNIX ONLY: rustix compiles on Windows
# but exposes neither module there, and both have a std-only Windows
# counterpart (FILE_SHARE_NONE opens, %COMPUTERNAME%), so the dependency
# simply does not exist in a Windows build.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
