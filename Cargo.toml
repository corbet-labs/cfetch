[package]
name = "cfetch"
version = "0.9.0"
edition = "2024"
license = "FSL-1.1-ALv2"
description = "A second brain for coding agents: privilege-ring memory, hook injection, retrieval, and a code index in one binary"
repository = "https://github.com/julian-corbet/cfetch"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
ignore = "0.4"
iroh = "1.0.3"
notify = "8"
ratatui = "0.30.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
# Codex config.toml registration (src/install.rs): structured upsert that
# preserves the user's comments and formatting — string-appending to a foreign
# config file is how files get corrupted.
toml_edit = "0.23"
tree-sitter = "0.26.12"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
# Embeddings HTTP client only (src/embed.rs). Minimal feature set: rustls for
# https endpoints, no gzip/charset/cookies; redirects are disabled per request
# policy (SSRF hardening), which ureq supports natively.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# flock(2) for the advisory lockfile (src/lockfile.rs) and uname(2) for the
# serving host's origin (src/serve.rs). UNIX ONLY: rustix compiles on Windows
# but exposes neither module there, and both have a std-only Windows
# counterpart (FILE_SHARE_NONE opens, %COMPUTERNAME%), so the dependency
# simply does not exist in a Windows build.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

# Inference engines. A variant is a feature selection, not a source fork:
# the runtimes do not overlap (Core ML is Apple-only, LiteRT's NPU delegates
# are per-vendor, OpenVINO is Intel's), so one binary carrying all of them
# would be mostly code any given user cannot run.
[features]
default = []
onnx = []
llamacpp = []
coreml = []
litert = []
openvino = []
