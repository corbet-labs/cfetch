# Licenses cargo-about may select when generating the distributable notice
# bundle. Keep this in step with deny.toml: the gate decides what may enter;
# this file decides which applicable license text is distributed.
accepted = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "Unlicense",
]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
ignore-dev-dependencies = true
workarounds = ["rustix", "rustls"]

# Crate-specific exceptions mirror deny.toml and must stay last.
[cfetch]
accepted = ["FSL-1.1-ALv2"]

[attohttpc]
accepted = ["MPL-2.0"]
